name: Publicar versión

# Al fusionar en main un cambio de VERSION (tuxenc/__init__.py) que aún no tiene etiqueta:
# pruebas → AppImage con las claves integradas → prueba de humo → etiqueta vX.Y.Z →
# Release con el zip, SHA256SUMS y las notas del CHANGELOG, y atestación de procedencia.
# Las versiones «-dev» no se publican. Si la etiqueta ya existe, no hace nada.
# A mano (Actions → Publicar versión → Run workflow) con «ensayo» marcado: compila y prueba
# el AppImage con las claves y lo deja como artefacto del run, sin etiqueta ni Release.
#
# Secretos (Settings → Environments → publicacion): TUXENC_KEY_TMDB y TUXENC_KEY_TVDB.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ensayo:
        description: "Ensayo: compilar y probar sin etiquetar ni publicar"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  version:
    name: ¿Hay versión nueva?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
      ensayo: ${{ steps.v.outputs.ensayo }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - id: v
        name: Leer VERSION y buscar su etiqueta
        env:
          GH_TOKEN: ${{ github.token }}
          ENSAYO: ${{ github.event_name == 'workflow_dispatch' && inputs.ensayo }}
        run: |
          set -euo pipefail
          echo "ensayo=$ENSAYO" >> "$GITHUB_OUTPUT"
          version="$(python3 -c 'import re,pathlib; print(re.search(r"^VERSION = \"([^\"]+)\"", pathlib.Path("tuxenc/__init__.py").read_text(), re.M).group(1))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$ENSAYO" = true ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Ensayo de $version: se compila y se prueba, sin publicar."
          elif [[ "$version" == *-dev* ]]; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$version es de pruebas: no se publica."
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version ya está publicada: nada que hacer."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Se publicará v$version."
          fi

  publicar:
    name: ${{ needs.version.outputs.ensayo == 'true' && 'Ensayo' || 'Compilar y publicar' }} v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: publicacion
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}
    permissions:
      contents: write        # etiqueta y Release
      id-token: write        # atestación de procedencia
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TUXENC_DEPS: ${{ github.workspace }}/../deps
      TUXENC_TESTMEDIA: ${{ github.workspace }}/tests/.media
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: astral-sh/setup-uv@v6

      - name: Bibliotecas del sistema (Qt sin pantalla y las X11 que se incluyen en el AppImage)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core procps \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxkbcommon-x11-0 binutils

      - name: Dependencias de Python
        run: pip install -r requirements-dev.txt

      - name: Notas de la versión (falla si el CHANGELOG no tiene la sección)
        run: python3 packaging/release_notes.py "$VERSION" > "$RUNNER_TEMP/notas.md"

      - name: Python portable, FFmpeg, appimagetool y libxcb-cursor
        run: |
          bash packaging/fetch_deps.sh
          echo "TUXENC_FFMPEG_DIR=$TUXENC_DEPS/rel-8.1/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1/bin" >> "$GITHUB_ENV"

      - name: Vídeos de prueba (caché)
        uses: actions/cache@v4
        with:
          path: tests/.media
          key: media-${{ hashFiles('tests/media.py') }}

      - name: Pruebas
        run: bash tests/run_all.sh

      - name: Compilar el AppImage con las claves integradas
        env:
          TUXENC_KEY_TMDB: ${{ secrets.TUXENC_KEY_TMDB }}
          TUXENC_KEY_TVDB: ${{ secrets.TUXENC_KEY_TVDB }}
          TUXENC_REQUIRE_KEYS: tmdb,tvdb
        run: python3 packaging/build.py

      - name: Prueba de humo del AppImage
        run: bash packaging/smoke_test.sh "dist/TuxEnc-$VERSION-x86_64.AppImage" tmdb,tvdb

      - name: Comprobar el zip y calcular SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          zip="TuxEnc-$VERSION-linux-x86_64.zip"
          contenido="$(python3 -c 'import sys,zipfile; print("\n".join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))' "$zip")"
          esperado="$(printf "TuxEnc-$VERSION/%s\n" CHANGELOG.md LICENSE.txt README.md "TuxEnc-$VERSION-x86_64.AppImage" | sort)"
          [ "$contenido" = "$esperado" ] || { echo "Contenido inesperado en $zip:"; echo "$contenido"; exit 1; }
          sha256sum "$zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Guardar el zip del ensayo
        if: needs.version.outputs.ensayo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TuxEnc-${{ needs.version.outputs.version }}-ensayo
          path: |
            dist/TuxEnc-${{ needs.version.outputs.version }}-linux-x86_64.zip
            dist/SHA256SUMS
          retention-days: 7

      - name: Atestación de procedencia
        if: needs.version.outputs.ensayo != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/TuxEnc-${{ needs.version.outputs.version }}-linux-x86_64.zip
            dist/TuxEnc-${{ needs.version.outputs.version }}-x86_64.AppImage

      - name: Etiqueta v${{ needs.version.outputs.version }}
        if: needs.version.outputs.ensayo != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "TuxEnc $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Release
        if: needs.version.outputs.ensayo != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --latest \
            --title "TuxEnc $VERSION" --notes-file "$RUNNER_TEMP/notas.md" \
            "dist/TuxEnc-$VERSION-linux-x86_64.zip" dist/SHA256SUMS
