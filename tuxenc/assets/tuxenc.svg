<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4f6bd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f6bd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="0.45" stop-color="#ff5e8a"/>
      <stop offset="1" stop-color="#2fd5ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c3550"/>
      <stop offset="1" stop-color="#151a2b"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f5"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b8f4ff"/>
      <stop offset="0.5" stop-color="#2fd5ff"/>
      <stop offset="1" stop-color="#1279a8"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Tira de película que se transforma (entrada cálida -> salida fría en píxeles) -->
    <g>
      <path d="M -20 392 C 130 340, 330 350, 440 286" fill="none" stroke="url(#film)" stroke-width="74" stroke-linecap="butt"/>
      <path d="M -20 366 C 130 314, 330 324, 440 260" fill="none" stroke="#121a33" stroke-opacity="0.75" stroke-width="9" stroke-dasharray="12 12"/>
      <path d="M -20 418 C 130 366, 330 376, 440 312" fill="none" stroke="#121a33" stroke-opacity="0.75" stroke-width="9" stroke-dasharray="12 12"/>
      <!-- Píxeles saliendo -->
      <rect x="440" y="252" width="30" height="30" rx="4" fill="#2fd5ff"/>
      <rect x="446" y="292" width="22" height="22" rx="3" fill="#2fd5ff" opacity="0.85"/>
      <rect x="478" y="236" width="20" height="20" rx="3" fill="#2fd5ff" opacity="0.75"/>
      <rect x="480" y="272" width="16" height="16" rx="2" fill="#2fd5ff" opacity="0.6"/>
      <rect x="474" y="306" width="12" height="12" rx="2" fill="#2fd5ff" opacity="0.45"/>
      <rect x="500" y="254" width="10" height="10" rx="2" fill="#2fd5ff" opacity="0.4"/>
    </g>

    <!-- Pingüino -->
    <g>
      <!-- sombra -->
      <ellipse cx="256" cy="458" rx="104" ry="14" fill="#000" opacity="0.28"/>
      <!-- pies -->
      <ellipse cx="216" cy="446" rx="40" ry="16" fill="url(#orange)"/>
      <ellipse cx="296" cy="446" rx="40" ry="16" fill="url(#orange)"/>
      <!-- aleta izquierda -->
      <path d="M 150 270 C 108 300, 92 350, 104 392 C 112 402, 126 396, 132 384 C 146 350, 158 322, 170 300 Z" fill="#1b2136"/>
      <!-- cuerpo -->
      <path d="M 256 128 C 176 128, 136 200, 136 300 C 136 390, 186 450, 256 450 C 326 450, 376 390, 376 300 C 376 200, 336 128, 256 128 Z" fill="url(#body)"/>
      <!-- barriga y máscara -->
      <path d="M 256 196 C 236 196, 222 200, 212 206 C 186 206, 170 228, 172 252 C 160 280, 168 318, 170 340 C 176 400, 212 432, 256 432 C 300 432, 336 400, 342 340 C 344 318, 352 280, 340 252 C 342 228, 326 206, 300 206 C 290 200, 276 196, 256 196 Z" fill="url(#belly)"/>
      <!-- ojos -->
      <circle cx="226" cy="246" r="18" fill="#151a2b"/>
      <circle cx="286" cy="246" r="18" fill="#151a2b"/>
      <circle cx="232" cy="239" r="6.5" fill="#fff"/>
      <circle cx="292" cy="239" r="6.5" fill="#fff"/>
      <!-- mejillas -->
      <ellipse cx="206" cy="282" rx="13" ry="8" fill="#ff8fb1" opacity="0.55"/>
      <ellipse cx="306" cy="282" rx="13" ry="8" fill="#ff8fb1" opacity="0.55"/>
      <!-- pico -->
      <path d="M 238 268 C 246 262, 266 262, 274 268 C 270 284, 262 292, 256 292 C 250 292, 242 284, 238 268 Z" fill="url(#orange)"/>
      <!-- gafas de trabajo en la frente -->
      <path d="M 142 196 C 190 168, 322 168, 370 196" fill="none" stroke="#0d1120" stroke-width="14" stroke-linecap="round"/>
      <circle cx="220" cy="184" r="27" fill="#0d1120"/>
      <circle cx="292" cy="184" r="27" fill="#0d1120"/>
      <circle cx="220" cy="184" r="20" fill="url(#lens)"/>
      <circle cx="292" cy="184" r="20" fill="url(#lens)"/>
      <rect x="244" y="178" width="24" height="10" rx="4" fill="#0d1120"/>
      <circle cx="213" cy="177" r="5" fill="#fff" opacity="0.8"/>
      <circle cx="285" cy="177" r="5" fill="#fff" opacity="0.8"/>
      <!-- aleta derecha levantada (saludando / empujando la cinta) -->
      <path d="M 356 258 C 384 232, 410 212, 434 200 C 452 194, 462 212, 450 226 C 428 252, 404 280, 370 312 Z" fill="#1b2136"/>
    </g>
  </g>
</svg>
