name: Pruebas

# Se ejecuta en el push de cada rama (las de Claude y las de Dependabot incluidas) y su
# resultado sale en el PR. Sin disparador pull_request: en los PR que abre el bot generaba
# una segunda ejecución que pedía aprobación y no aportaba nada.
on:
  push:
    branches: [main, "claude/**", "dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (Ubuntu 24.04, FFmpeg 8.1, Qt sin pantalla)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TUXENC_DEPS: ${{ github.workspace }}/../deps
      TUXENC_TESTMEDIA: ${{ github.workspace }}/tests/.media
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bibliotecas del sistema para Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core procps

      - name: Dependencias de Python
        run: pip install -r requirements-dev.txt

      - name: FFmpeg 8.1 (el mismo que lleva el AppImage)
        run: |
          bash packaging/fetch_deps.sh ffmpeg
          echo "TUXENC_FFMPEG_DIR=$TUXENC_DEPS/rel-8.1/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1/bin" >> "$GITHUB_ENV"

      - name: Vídeos de prueba (caché)
        uses: actions/cache@v4
        with:
          path: tests/.media
          key: media-${{ hashFiles('tests/media.py') }}

      - name: Pruebas
        run: bash tests/run_all.sh
